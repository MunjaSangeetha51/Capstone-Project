async function api(path, body, method=body?'POST':'GET'){
  const isForm = body instanceof FormData;
  const token=localStorage.getItem('skillproof-token');
  const options={method,headers:{...(token?{Authorization:`Bearer ${token}`}:{})}};
  if(body){if(!isForm)options.headers['Content-Type']='application/json';options.body=isForm?body:JSON.stringify(body)}
  const r = await fetch('/api/'+path, options);
  const data = await r.json();
  if(!r.ok){
    const detail=Array.isArray(data.detail)?data.detail.map(item=>item.msg||'Invalid value').join('. '):data.detail;
    throw new Error(detail || `Request failed (${r.status})`);
  }
  return data;
}
function persist(){

      parsed:S.parsed,evidence:S.evidence,quiz:S.quiz,subs:S.subs,quizSeen:S.quizSeen,res:S.res,customSkills:S.customSkills,
      customQuizBanks:S.customQuizBanks,customQuizResults:S.customQuizResults,
      importedInternships:S.importedInternships,internshipImportFile:S.internshipImportFile,roadmapSkills:S.roadmapSkills,gapProfile:S.gapProfile,
      leverageScenario:S.leverageScenario,leverageMode:S.leverageMode};
    const serialized=JSON.stringify(savedState);
    if(serialized.length>2_000_000)throw new Error('Saved profile and internship data exceed the browser storage limit. Remove some listings and re-import.');
    localStorage.setItem(STORE_KEY,serialized);

}

function internshipReport(posting){
  const requirements=Object.entries(posting.req||{});
  const evidenceFor=skill=>Number(S.evidence[skill])||0;
  const quizFor=skill=>Number.isFinite(S.quiz[skill])?S.quiz[skill]:null;
  const correctedFor=skill=>{
    const quiz=quizFor(skill), evidence=evidenceFor(skill);
    return quiz===null?Math.round(.4*evidence):Math.round(.7*quiz+.3*evidence);
  };
  const matched=requirements.filter(([skill,need])=>correctedFor(skill)>=need).length;
  const coverage=requirements.length?Math.round(100*requirements.reduce((total,[skill,need])=>total+Math.min(correctedFor(skill)/need,1),0)/requirements.length):0;
  const detail=requirements.map(([skill,need])=>{
    const evidence=evidenceFor(skill),quiz=quizFor(skill),corrected=correctedFor(skill);
    const status=corrected>=need
      ?`Requirement met${quiz===null?' · quiz not taken':' · quiz verified'}`
      :quiz!==null?'Quiz taken · below threshold':evidence?'Resume claim · not quiz-verified':'Not evidenced yet';
    return `<div class="item"><div class="row" style="justify-content:space-between"><b>${esc(skill)}</b><span class="badge ${corrected>=need?'strong':quiz!==null?'medium':'weak'}">${esc(status)}</span></div>
      <div class="track" style="margin:10px 0"><div class="fill" style="width:${Math.min(100,Math.round(corrected/need*100))}%;background:${corrected>=need?'#2a9d8f':'#f5a623'}"></div></div>
      <small class="mut">Posting threshold ${need}/100 · Resume evidence ${evidence}/100 · ${quiz===null?'No quiz score':`Quiz ${quiz}/100`} · Trust-corrected level ${corrected}/100</small>
      ${quiz===null?`<p><button class="btn o" onclick="act(openSkillQuiz('${esc(skill)}'))">Take ${esc(skill)} quiz</button></p>`:''}</div>`;
  }).join('');
  const suggestions=[];
  if(requirements.some(([skill])=>quizFor(skill)===null))suggestions.push('Verify the required skills with SkillProof quizzes. Unverified resume claims are discounted.');
  if(requirements.some(([skill])=>evidenceFor(skill)===0))suggestions.push('Add accurate project or experience examples for skills that are not evidenced in your resume or project file.');
  if(matched<requirements.length){
    const below=requirements.filter(([skill,need])=>correctedFor(skill)<need).map(([skill])=>skill);
    suggestions.push(`Focus next on ${below.join(', ')} to reach this posting's listed skill thresholds.`);
  }
  if(!suggestions.length)suggestions.push('Your current trust-corrected profile meets this sample posting’s listed skill thresholds. Review each resume claim before applying.');
  return `<div class="item"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><h4>SkillProof match report</h4><b>${coverage}% required-skill coverage</b></div>
    <p class="mut">Based on this sample posting’s listed skill thresholds, your resume evidence, and quiz scores. This is not an employer ATS score or hiring prediction.</p>
    <h4 style="margin-top:14px">Requirement-by-requirement analysis</h4>${detail||'<p class="mut">This posting has no skill requirements to compare.</p>'}
    <h4 style="margin-top:14px">Recommended next steps</h4>${suggestions.map(text=>`<p class="recommendation">${esc(text)}</p>`).join('')}
  </div>`;
}

function importedInternshipMetrics(posting){
  const skills=Object.keys(INTERNSHIP_SKILLS).filter(skill=>matchesSkill(posting.requiredSkills,skill));
  const evidenceCorpus=[
    ...S.parsed.flatMap(item=>[item.skill,...(item.context||[])]),
    S.profile.programmingLanguages,S.profile.webDevelopment,S.profile.databaseSkills,
    S.profile.aiMlSkills,S.profile.dataAnalyticsSkills,S.profile.frameworksLibraries,
    ...(S.profile.projects||[]).flatMap(project=>[project.title,project.description,project.technologies,project.languages,project.outcomes])
  ].filter(Boolean).join(' ').toLowerCase();
  const termCounts=text=>{
    const terms=(String(text||'').toLowerCase().match(/[a-z][a-z0-9+#.]{2,}/g)||[])
      .map(term=>term.replace(/\.+$/,''))
      .filter(term=>term&&!JOB_STOPWORDS.has(term));
    return terms.reduce((counts,term)=>{counts[term]=(counts[term]||0)+1;return counts},{});
  };
  const jobTerms=termCounts(posting.jobDescription);
  const topKeywords=Object.keys(jobTerms).sort((a,b)=>jobTerms[b]-jobTerms[a]||a.localeCompare(b)).slice(0,20);
  const matchedKeywords=topKeywords.filter(term=>containsTerm(evidenceCorpus,term));
  const keywordScore=topKeywords.length?Math.round(100*matchedKeywords.length/topKeywords.length):0;
  const skillAnalysis=skills.map(skill=>{
    const evidence=Number(S.evidence[skill])||0;
    const quiz=Number.isFinite(S.quiz[skill])?S.quiz[skill]:null;
    const corrected=quiz===null?Math.round(.4*evidence):Math.round(.7*quiz+.3*evidence);
    return {skill,evidence,quiz,corrected,meets:corrected>=60};
  });
  const skillScore=skillAnalysis.length
    ?Math.round(skillAnalysis.reduce((total,item)=>total+Math.min(item.corrected/60,1),0)*100/skillAnalysis.length)
    :null;
  const score=skillScore===null?keywordScore:Math.round(.75*skillScore+.25*keywordScore);
  return {skillAnalysis,skillScore,score,keywordScore,matchedKeywords,topKeywords};
}

function matchesSkill(text,skill){
  const value=String(text||'').toLowerCase();
  return INTERNSHIP_SKILLS[skill].some(alias=>{
    const escaped=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return new RegExp(`(^|[^a-z0-9])${escaped}([^a-z0-9]|$)`,'i').test(value);
  });
}
function containsTerm(text,term){
  const escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp(`(^|[^a-z0-9])${escaped}([^a-z0-9]|$)`,'i').test(text);
}
function safeExternalUrl(value){
  try{
    const url=new URL(value);
    return url.protocol==='https:'?url.href:'';
  }catch{return ''}
}

function parseCsv(text){
  const rows=[];
  let row=[],field='',quoted=false;
  for(let i=0;i<text.length;i++){
    const char=text[i];
    if(quoted){
      if(char==='"'&&text[i+1]==='"'){field+='"';i++}
      else if(char==='"')quoted=false;
      else field+=char;
    }else if(char==='"'&&field==='')quoted=true;
    else if(char===','){row.push(field);field=''}
    else if(char==='\n'||char==='\r'){
      if(char==='\r'&&text[i+1]==='\n')i++;
      row.push(field);field='';
      if(row.some(value=>value.trim()))rows.push(row);
      row=[];
    }else field+=char;
  }
  if(quoted)throw new Error('CSV contains an unclosed quoted field.');
  row.push(field);
  if(row.some(value=>value.trim()))rows.push(row);
  if(rows.length<2)throw new Error('CSV must include a header row and at least one response row.');
  const headers=rows[0].map((header,index)=>header.trim()||`Column ${index+1}`);
  if(headers.length>100)throw new Error('CSV cannot contain more than 100 columns.');
  const responseRows=rows.slice(1);
  if(responseRows.length>10000)throw new Error('CSV cannot contain more than 10,000 response rows.');
  return {headers,rows:responseRows.map(values=>headers.map((_,index)=>values[index]||''))};
}
function parseInternshipCsv(text){
  const parsed=parseCsv(text);
  const normalize=header=>header.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const aliases={
    company:['company name'],title:['internship title'],requiredSkills:['required skills'],
    jobDescription:['job description'],location:['location'],workMode:['work mode'],
    stipend:['stipend'],applyUrl:['apply url','application link'],postedDate:['posted date'],
    deadline:['deadline'],status:['status'],source:['source','source website']
  };
  const normalizedHeaders=parsed.headers.map(normalize);
  const columns={};
  for(const [key,names] of Object.entries(aliases)){
    const index=normalizedHeaders.findIndex(header=>names.includes(header));
    if(index<0)throw new Error(`CSV is missing the required "${names[0]}" column.`);
    columns[key]=index;
  }
  if(parsed.rows.length>500)throw new Error('Import at most 500 internship listings at a time.');
  const limits={company:200,title:200,requiredSkills:1000,jobDescription:12000,location:300,workMode:100,stipend:200,applyUrl:2000,postedDate:100,deadline:100,status:100,source:500};
  const required=['company','title','requiredSkills','jobDescription','applyUrl','source'];
  return parsed.rows.map((row,rowIndex)=>{
    const listing={};
    for(const [key,index] of Object.entries(columns)){
      const value=String(row[index]||'').trim();
      if(value.length>limits[key])throw new Error(`Row ${rowIndex+2}: "${aliases[key][0]}" exceeds ${limits[key]} characters.`);
      listing[key]=value;
    }
    for(const key of required){
      if(!listing[key])throw new Error(`Row ${rowIndex+2}: "${aliases[key][0]}" cannot be empty.`);
    }
    if(!safeExternalUrl(listing.applyUrl))throw new Error(`Row ${rowIndex+2}: Apply URL must be a valid HTTPS link.`);
    if(!listing.status)listing.status='Needs verification';
    return listing;
  });
}

    try{await saveProfileToMysql();await api(`profiles/${PROFILE_ID}/quiz-attempts`,{skill:r.skill,score:r.score,sub_scores:r.subs,question_ids:S.qs.questions.map(question=>question.id)},'POST')}
    catch(error){console.info('Quiz score remains in this browser because MySQL persistence failed:',error.message)}
  }
  await refresh(); toast(r.skill+': '+r.score+'%'); S.tab='verify'; render();
}
async function demo(){
  go('resume');
  const transfer=new DataTransfer();
  transfer.items.add(new File([SAMPLE],'sample-resume.txt',{type:'text/plain'}));
  $('#resumeFile').files=transfer.files;
  showFileName('resumeFile','resumeSelected');
  await doParse();
  go('dashboard');
}
function start(){
  try{restore()}catch(error){console.error('Could not restore saved SkillProof data',error);toast('Saved session data could not be loaded');}
  render(); act(api('config').then(async config=>{S.mysqlConfigured=!!config.mysql_configured;if(S.mysqlConfigured){await loadProfileFromMysql();await loadQuizAttemptsFromMysql()}}).then(()=>refresh()).then(render));
}
start();
